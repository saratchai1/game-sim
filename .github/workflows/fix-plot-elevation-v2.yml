name: Fix 3D plot elevation v2

on:
  push:
    branches:
      - feat/3d-isometric-world
    paths:
      - .github/workflows/fix-plot-elevation-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-isometric-world
          fetch-depth: 0
      - name: Lift plot tiles clearly above the raised meadow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/MangroveWorld3D.jsx')
          text = path.read_text()
          old = "return [PLOT_X[index % 4], 0.62, PLOT_Z[Math.floor(index / 4)]]"
          new = "return [PLOT_X[index % 4], 0.92, PLOT_Z[Math.floor(index / 4)]]"
          if old not in text:
              raise SystemExit('Expected current plot elevation not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MangroveWorld3D.jsx
          git commit -m "fix: expose planting tiles above meadow"
          git push origin HEAD:feat/3d-isometric-world
