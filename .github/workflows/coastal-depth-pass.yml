name: Coastal depth pass

on:
  push:
    branches:
      - feat/3d-isometric-world
    paths:
      - .github/workflows/coastal-depth-pass.yml
      - scripts/apply-coastal-depth-pass.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-isometric-world
          fetch-depth: 0

      - name: Apply coastal depth pass
        run: python scripts/apply-coastal-depth-pass.py

      - name: Commit coastal depth pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MangroveWorld3DNatural.jsx
          git commit -m "style: add tidal channels and animated carbon canopy"
          git push origin HEAD:feat/3d-isometric-world
