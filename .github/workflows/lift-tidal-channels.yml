name: Lift tidal channels

on:
  push:
    branches:
      - feat/coastal-depth-polish
    paths:
      - .github/workflows/lift-tidal-channels.yml
      - scripts/lift-tidal-channels.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coastal-depth-polish
          fetch-depth: 0
      - name: Lift channel surfaces above the mudflat
        run: python scripts/lift-tidal-channels.py
      - name: Commit channel fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MangroveWorld3DNatural.jsx
          git commit -m "fix: expose tidal channels across the mudflat"
          git push origin HEAD:feat/coastal-depth-polish
