name: One-time 3D world polish

on:
  push:
    branches:
      - feat/3d-isometric-world
    paths:
      - .github/workflows/one-time-world-fix.yml

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/3d-isometric-world
          fetch-depth: 0

      - name: Surface plots and brighten water
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/MangroveWorld3D.jsx')
          text = path.read_text()
          replacements = {
              "return [PLOT_X[index % 4], 0.15, PLOT_Z[Math.floor(index / 4)]]":
                  "return [PLOT_X[index % 4], 0.64, PLOT_Z[Math.floor(index / 4)]]",
              '<mesh receiveShadow rotation={[-Math.PI / 2, 0, 0]}>':
                  '<mesh rotation={[-Math.PI / 2, 0, 0]}>',
              '<meshStandardMaterial color="#49bddd" roughness={0.28} metalness={0.04} />':
                  '<meshStandardMaterial color="#55c9e4" emissive="#1883a1" emissiveIntensity={0.18} roughness={0.28} metalness={0.04} />',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          css = Path('src/three-world.css')
          css_text = css.read_text()
          css_text = css_text.replace(
              '.world-canvas,\n.world-canvas > div,',
              '.world-canvas { z-index: 0; }\n\n.world-canvas,\n.world-canvas > div,',
              1,
          )
          css_text = css_text.replace('  z-index: 5;\n  pointer-events: none;', '  z-index: 10;\n  pointer-events: none;', 1)
          css.write_text(css_text)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate production build
        run: |
          npm install
          npm run build

      - name: Install visual QA browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start app and capture visual QA
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/game-sim-vite.log 2>&1 &
          npx --yes wait-on@8.0.4 http://127.0.0.1:5173 --timeout 60000
          node scripts/visual-qa.mjs

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: mangrove-bay-3d-polished-visual-qa
          path: visual-qa/*
          if-no-files-found: error
          retention-days: 7

      - name: Commit polished scene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MangroveWorld3D.jsx src/three-world.css
          git commit -m "fix: surface planting plots and polish 3d water"
          git push origin HEAD:feat/3d-isometric-world
