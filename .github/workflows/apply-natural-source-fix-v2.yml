name: Apply natural world source fix v2

on:
  push:
    branches:
      - feat/3d-isometric-world
    paths:
      - .github/workflows/apply-natural-source-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-isometric-world
          fetch-depth: 0

      - name: Apply render fixes directly in source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          world_path = Path('src/MangroveWorld3DNatural.jsx')
          code = world_path.read_text()

          code, import_count = re.subn(
              r'(?m)^\s*ContactShadows,\s*\n',
              '',
              code,
              count=1,
          )

          old_zoom = 'const responsiveZoom = Math.max(13, Math.min(46, Math.min(size.width / 29, size.height / 22)))'
          new_zoom = '''const responsiveZoom = size.width < 600
                ? 22
                : size.width < 900
                  ? 30
                  : Math.max(30, Math.min(46, Math.min(size.width / 29, size.height / 22)))'''
          if old_zoom not in code:
              raise SystemExit('Expected camera zoom expression was not found')
          code = code.replace(old_zoom, new_zoom, 1)

          code, shadow_count = re.subn(
              r'\n\s*<ContactShadows\b[\s\S]*?resolution=\{256\}\s*/>\s*',
              '\n',
              code,
              count=1,
          )

          if import_count != 1:
              raise SystemExit(f'Expected one ContactShadows import, found {import_count}')
          if shadow_count != 1:
              raise SystemExit(f'Expected one ContactShadows JSX block, found {shadow_count}')
          if 'ContactShadows' in code:
              raise SystemExit('ContactShadows still remains in natural world source')
          if 'size.width < 600' not in code:
              raise SystemExit('Responsive camera zoom was not applied')

          world_path.write_text(code)

          Path('vite.config.js').write_text("""import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
          })
          """)
          PY

      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MangroveWorld3DNatural.jsx vite.config.js
          git commit -m "refactor: apply natural world render fixes in source"
          git push origin HEAD:feat/3d-isometric-world
