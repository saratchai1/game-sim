name: Game-feel world pass

on:
  push:
    branches:
      - feat/3d-isometric-world
    paths:
      - .github/workflows/gamefeel-world-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-isometric-world
          fetch-depth: 0

      - name: Blend plots into the coast and add game-feel animation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/MangroveWorld3DNatural.jsx')
          code = path.read_text()

          radius_old = """  const radiusX = 1.28 + pseudo(plot.id * 4.1) * 0.16
            const radiusZ = 0.95 + pseudo(plot.id * 6.7) * 0.13
          """
          radius_new = """  const radiusX = 0.92 + pseudo(plot.id * 4.1) * 0.12
            const radiusZ = 0.7 + pseudo(plot.id * 6.7) * 0.1
          """
          if radius_old not in code:
              raise SystemExit('Plot radius block not found')
          code = code.replace(radius_old, radius_new, 1)

          old_plot_surfaces = """      <mesh geometry={outerGeometry} rotation={[-Math.PI / 2, 0, 0]} position={[0, 0.006, 0]} receiveShadow>
                <meshStandardMaterial
                  color={borderColor}
                  emissive={selected ? '#735100' : hovered ? '#493300' : '#000000'}
                  emissiveIntensity={selected ? 0.5 : hovered ? 0.2 : 0}
                  roughness={0.82}
                />
              </mesh>
              <mesh geometry={innerGeometry} rotation={[-Math.PI / 2, 0, 0]} position={[0, 0.025, 0]} receiveShadow>
                <meshStandardMaterial color={plot.dead ? '#8f725b' : soilColor} roughness={0.98} />
              </mesh>
          """
          new_plot_surfaces = """      {(selected || hovered) && (
                <mesh geometry={outerGeometry} rotation={[-Math.PI / 2, 0, 0]} position={[0, 0.032, 0]}>
                  <meshBasicMaterial
                    color={borderColor}
                    transparent
                    opacity={selected ? 0.78 : 0.38}
                    depthWrite={false}
                  />
                </mesh>
              )}
              {(!occupied || selected || hovered || plot.dead) && (
                <mesh geometry={innerGeometry} rotation={[-Math.PI / 2, 0, 0]} position={[0, 0.038, 0]} receiveShadow>
                  <meshStandardMaterial
                    color={plot.dead ? '#705747' : soilColor}
                    roughness={1}
                    transparent
                    opacity={plot.dead ? 0.55 : selected ? 0.36 : hovered ? 0.25 : 0.12}
                    depthWrite={false}
                    polygonOffset
                    polygonOffsetFactor={-1}
                  />
                </mesh>
              )}
          """
          if old_plot_surfaces not in code:
              raise SystemExit('Plot surface block not found')
          code = code.replace(old_plot_surfaces, new_plot_surfaces, 1)

          hit_old = '<cylinderGeometry args={[Math.max(radiusX, radiusZ), Math.max(radiusX, radiusZ), 1.7, 12]} />'
          hit_new = '<cylinderGeometry args={[Math.max(radiusX, radiusZ) + 0.55, Math.max(radiusX, radiusZ) + 0.55, 1.8, 14]} />'
          if hit_old not in code:
              raise SystemExit('Plot hit target geometry not found')
          code = code.replace(hit_old, hit_new, 1)

          ring_old = '<torusGeometry args={[0.34, 0.045, 8, 24]} />'
          ring_new = '<torusGeometry args={[0.27, 0.035, 8, 24]} />'
          if ring_old not in code:
              raise SystemExit('Empty plot ring not found')
          code = code.replace(ring_old, ring_new, 1)

          marker_material_old = """        <meshStandardMaterial
                  color={hovered ? '#fff8b5' : '#f7d45c'}
                  emissive="#efb72d"
                  emissiveIntensity={hovered ? 0.55 : 0.16}
                  roughness={0.45}
                />
          """
          marker_material_new = """        <meshStandardMaterial
                  color={hovered ? '#fff8b5' : '#f7d45c'}
                  emissive="#efb72d"
                  emissiveIntensity={hovered ? 0.55 : 0.16}
                  roughness={0.45}
                  transparent
                  opacity={hovered ? 1 : 0.74}
                />
          """
          if marker_material_old not in code:
              raise SystemExit('Empty plot material not found')
          code = code.replace(marker_material_old, marker_material_new, 1)

          burst_component = r'''
function PlantingBurst({ seed = 0 }) {
  const group = useRef()
  const elapsed = useRef(0)
  const particles = useMemo(() => (
    Array.from({ length: 9 }, (_, index) => {
      const angle = (Math.PI * 2 * index) / 9 + pseudo(seed * 5.1) * 0.4
      return {
        x: Math.cos(angle) * (0.55 + pseudo(seed + index * 4.7) * 0.35),
        z: Math.sin(angle) * (0.55 + pseudo(seed + index * 7.1) * 0.35),
        lift: 0.38 + pseudo(seed + index * 2.9) * 0.42,
        color: index % 3 === 0 ? '#fff0a2' : index % 3 === 1 ? '#8be16a' : '#65d7e8',
      }
    })
  ), [seed])

  useFrame((_, delta) => {
    if (!group.current) return
    elapsed.current += delta
    const progress = Math.min(1, elapsed.current / 1.45)
    group.current.visible = progress < 1
    group.current.children.forEach((child, index) => {
      const particle = particles[index]
      child.position.set(
        particle.x * progress,
        0.16 + Math.sin(progress * Math.PI) * particle.lift,
        particle.z * progress,
      )
      child.scale.setScalar(0.72 + Math.sin(progress * Math.PI) * 0.7)
      child.material.opacity = Math.max(0, 1 - progress)
    })
  })

  return (
    <group ref={group} position={[0, 0.12, 0]}>
      {particles.map((particle, index) => (
        <mesh key={index}>
          <sphereGeometry args={[0.075, 7, 5]} />
          <meshBasicMaterial color={particle.color} transparent opacity={1} depthWrite={false} />
        </mesh>
      ))}
    </group>
  )
}

'''
          selection_anchor = 'function SelectionMarker() {'
          if selection_anchor not in code:
              raise SystemExit('Selection marker anchor not found')
          code = code.replace(selection_anchor, burst_component + selection_anchor, 1)

          tree_old = """      {occupied
                ? <MangroveTree plot={plot} plotId={plot.id} />
                : <EmptyPlotMarker activeSpecies={activeSpecies} hovered={hovered} />}
          """
          tree_new = """      {occupied ? (
                <>
                  <MangroveTree plot={plot} plotId={plot.id} />
                  {plot.age === 0 && !plot.dead && <PlantingBurst seed={plot.id} />}
                </>
              ) : (
                <EmptyPlotMarker activeSpecies={activeSpecies} hovered={hovered} />
              )}
          """
          if tree_old not in code:
              raise SystemExit('Tree/empty marker block not found')
          code = code.replace(tree_old, tree_new, 1)

          water_signature_old = 'function Water() {'
          water_signature_new = 'function Water({ day }) {'
          if water_signature_old not in code:
              raise SystemExit('Water function not found')
          code = code.replace(water_signature_old, water_signature_new, 1)

          water_frame_old = """  useFrame((state) => {
              if (group.current) group.current.position.y = -0.58 + Math.sin(state.clock.elapsedTime * 0.55) * 0.022
            })
          """
          water_frame_new = """  const tideOffset = [-0.08, -0.01, 0.11, 0.01][(Math.max(1, day) - 1) % 4]

            useFrame((state) => {
              if (group.current) {
                group.current.position.y = -0.58 + tideOffset + Math.sin(state.clock.elapsedTime * 0.55) * 0.022
              }
            })
          """
          if water_frame_old not in code:
              raise SystemExit('Water animation block not found')
          code = code.replace(water_frame_old, water_frame_new, 1)

          water_call_old = '      <Water />'
          water_call_new = '      <Water day={day} />'
          if water_call_old not in code:
              raise SystemExit('Water scene call not found')
          code = code.replace(water_call_old, water_call_new, 1)

          details_component = r'''
function MudflatDetails() {
  const details = useMemo(() => (
    Array.from({ length: 46 }, (_, index) => ({
      x: -11.4 + pseudo(index * 5.33 + 2) * 22.8,
      z: -8.6 + pseudo(index * 8.19 + 9) * 14.1,
      scale: 0.45 + pseudo(index * 2.17 + 4) * 0.8,
      type: index % 4,
      rotation: pseudo(index * 7.7 + 11) * Math.PI * 2,
    }))
  ), [])

  return (
    <group>
      {details.map((detail, index) => {
        if (detail.type === 0) {
          return (
            <mesh
              key={index}
              position={[detail.x, 0.425, detail.z]}
              rotation={[-Math.PI / 2, 0, detail.rotation]}
              scale={[detail.scale * 1.45, detail.scale, 1]}
            >
              <circleGeometry args={[0.24, 12]} />
              <meshBasicMaterial color="#523d30" transparent opacity={0.1} depthWrite={false} />
            </mesh>
          )
        }
        if (detail.type === 1) {
          return (
            <mesh
              key={index}
              position={[detail.x, 0.455, detail.z]}
              rotation={[0, detail.rotation, 0]}
              scale={[detail.scale, detail.scale * 0.32, detail.scale * 0.62]}
              castShadow
            >
              <sphereGeometry args={[0.11, 7, 5]} />
              <meshStandardMaterial color={index % 3 ? '#d9c392' : '#efe0b4'} roughness={0.95} />
            </mesh>
          )
        }
        if (detail.type === 2) {
          return (
            <group key={index} position={[detail.x, 0.445, detail.z]} rotation={[0, detail.rotation, 0]} scale={detail.scale}>
              <mesh position={[0, 0.03, 0]} rotation={[0, 0, Math.PI / 2]} castShadow>
                <cylinderGeometry args={[0.022, 0.03, 0.48, 5]} />
                <meshStandardMaterial color="#765139" roughness={1} />
              </mesh>
              <mesh position={[0.13, 0.05, 0.03]} rotation={[0.3, 0, 0]}>
                <coneGeometry args={[0.045, 0.16, 5]} />
                <meshStandardMaterial color="#8abc55" roughness={1} />
              </mesh>
            </group>
          )
        }
        return (
          <GrassTuft
            key={index}
            position={[detail.x, 0.43, detail.z]}
            scale={detail.scale * 0.42}
            color={index % 2 ? '#6cae4d' : '#80bd58'}
            seed={index + 600}
          />
        )
      })}
    </group>
  )
}

'''
          reed_anchor = 'function ReedBeds() {'
          if reed_anchor not in code:
              raise SystemExit('Reed bed anchor not found')
          code = code.replace(reed_anchor, details_component + reed_anchor, 1)

          terrain_call_old = """      <CoastalTerrain />
              <DecorativeMangroves />
          """
          terrain_call_new = """      <CoastalTerrain />
              <MudflatDetails />
              <DecorativeMangroves />
          """
          if terrain_call_old not in code:
              raise SystemExit('Terrain scene block not found')
          code = code.replace(terrain_call_old, terrain_call_new, 1)

          worker_frame_pattern = re.compile(
              r"  useFrame\(\(state\) => \{\n"
              r"    if \(!group\.current\) return\n"
              r"    group\.current\.position\.y = position\[1\] \+ Math\.sin\(state\.clock\.elapsedTime \* 1\.7 \+ seed\) \* 0\.025\n"
              r"  \}\)"
          )
          worker_frame_new = """  useFrame((state) => {
              if (!group.current) return
              const walk = Math.sin(state.clock.elapsedTime * 0.38 + seed)
              group.current.position.x = position[0] + walk * 0.18
              group.current.position.z = position[2] + Math.cos(state.clock.elapsedTime * 0.3 + seed) * 0.08
              group.current.position.y = position[1] + Math.sin(state.clock.elapsedTime * 1.7 + seed) * 0.025
              group.current.rotation.y = seed * 0.6 + walk * 0.16
            })"""
          code, worker_count = worker_frame_pattern.subn(worker_frame_new, code, count=1)
          if worker_count != 1:
              raise SystemExit(f'Worker animation block replacement count: {worker_count}')

          required = [
              'function PlantingBurst',
              'function MudflatDetails',
              '<Water day={day} />',
              'Math.max(radiusX, radiusZ) + 0.55',
              'opacity={selected ? 0.78 : 0.38}',
          ]
          missing = [item for item in required if item not in code]
          if missing:
              raise SystemExit(f'Missing expected game-feel changes: {missing}')

          path.write_text(code)
          PY

      - name: Commit game-feel pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MangroveWorld3DNatural.jsx
          git commit -m "style: blend planting zones into the living coast"
          git push origin HEAD:feat/3d-isometric-world
