name: Game-feel world pass

on:
  push:
    branches:
      - feat/3d-isometric-world
    paths:
      - .github/workflows/gamefeel-world-pass.yml
      - scripts/apply-gamefeel-world-pass.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-isometric-world
          fetch-depth: 0

      - name: Blend plots into the living coast
        run: python scripts/apply-gamefeel-world-pass.py

      - name: Commit game-feel pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MangroveWorld3DNatural.jsx
          git commit -m "style: blend planting zones into the living coast"
          git push origin HEAD:feat/3d-isometric-world
