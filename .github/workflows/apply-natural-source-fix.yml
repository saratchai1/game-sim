name: Apply natural world source fix

on:
  push:
    branches:
      - feat/3d-isometric-world
    paths:
      - .github/workflows/apply-natural-source-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-isometric-world
          fetch-depth: 0

      - name: Move render fixes from Vite transform into source
        run: |
          python - <<'PY'
          from pathlib import Path

          world_path = Path('src/MangroveWorld3DNatural.jsx')
          code = world_path.read_text()

          old_zoom = "const responsiveZoom = Math.max(13, Math.min(46, Math.min(size.width / 29, size.height / 22)))"
          new_zoom = """const responsiveZoom = size.width < 600
                ? 22
                : size.width < 900
                  ? 30
                  : Math.max(30, Math.min(46, Math.min(size.width / 29, size.height / 22)))"""

          shadow_block = """      <ContactShadows
                position={[0, -0.54, 0]}
                opacity={0.3}
                scale={34}
                blur={2.7}
                far={16}
                resolution={256}
              />
          """

          changed = code
          changed = changed.replace('  ContactShadows,\n', '', 1)
          changed = changed.replace(old_zoom, new_zoom, 1)
          changed = changed.replace(shadow_block, '', 1)

          if changed == code:
              raise SystemExit('Expected natural-world render fixes were not found')
          if 'ContactShadows' in changed:
              raise SystemExit('ContactShadows remained after source cleanup')
          if 'size.width < 600' not in changed:
              raise SystemExit('Responsive camera zoom was not applied')

          world_path.write_text(changed)

          Path('vite.config.js').write_text("""import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
          })
          """)
          PY

      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MangroveWorld3DNatural.jsx vite.config.js
          git commit -m "refactor: apply natural world render fixes in source"
          git push origin HEAD:feat/3d-isometric-world
